#Camera behaviour while mounting and dismounting.
[camera]
	#Ease the camera into place instead of letting it snap. Turn off to keep the animation but lose the camera work.
	smoothCamera = true
	#How long the camera takes to settle when mounting in first person, in milliseconds.
	# Default: 300
	# Range: 0 ~ 3000
	mountFirstPersonMs = 300
	#How long the camera takes to settle when mounting in third person, in milliseconds.
	#Longer than first person by default: the camera has further to travel.
	# Default: 450
	# Range: 0 ~ 3000
	mountThirdPersonMs = 450
	#How long the camera takes to settle when dismounting, in milliseconds.
	# Default: 250
	# Range: 0 ~ 3000
	dismountMs = 250
	#Peak of the vertical arc the camera swings through mid-move, in blocks.
	#0 removes the arc and moves the camera in a straight line.
	# Default: 0.5
	# Range: 0.0 ~ 2.0
	arcHeight = 0.5
	#Carry the camera along with the body while it climbs, instead of leaving it
	#pinned to the position the game teleported to the saddle.
	#Third person only unless followBodyFirstPerson is also on.
	followBody = true
	#Extend followBody to first person. Off by default, and read the warning:
	#half a second of translation you did not ask for is how motion sickness starts,
	#and first person has no terrain raycast, so the view can pass through blocks.
	followBodyFirstPerson = false
	#How much of the body movement the camera takes on. 1.0 follows it exactly,
	#0.5 half of it. Lower this before turning followBody off entirely.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	followBodyStrength = 1.0

#A creak when getting on and off.
#Vanilla has no sound for mounting or dismounting at all - entity.horse.saddle
#only fires when the saddle goes on the animal - so this is added behaviour,
#which is why it has its own switch.
[sound]
	#Play a sound when mounting and dismounting.
	enabled = true
	#Sound id played on mount. Any id in the sound registry works, including
	#one added by a resource pack. Leave empty for silence.
	mountSound = "minecraft:entity.horse.saddle"
	#Sound id played on dismount.
	dismountSound = "minecraft:entity.horse.saddle"
	#Volume. 0 is silent.
	# Default: 0.7
	# Range: 0.0 ~ 2.0
	volume = 0.7
	#Pitch on mount.
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	mountPitch = 1.0
	#Pitch on dismount. A touch lower than the mount by default, so getting off
	#reads as the answer to getting on rather than a repeat of it.
	# Default: 0.9
	# Range: 0.5 ~ 2.0
	dismountPitch = 0.9

#Which mounts get animated.
[animation]
	#EXPERIMENTAL. Use the minecart animation for boats and minecarts.
	#
	#Upstream ships this animation but never selects it. Here it plays on both
	#getting in and getting out, but it is not finished yet, so it is off by
	#default. Set to true to try it.
	animateVehicles = false
	#Playback speed of the boat and minecart animation.
	#
	#The clip is 1.0s of authored motion against a horse mount of 0.54s and a horse
	#dismount that already runs at 1.3 speed for an effective 0.58s - so at 1.0 it
	#is nearly twice as long as anything else the mod plays, which reads as heavy.
	#1.7 puts it at 0.59s, in line with the rest. Higher is faster.
	# Default: 1.7
	# Range: 0.5 ~ 3.0
	vehicleAnimationSpeed = 1.7
	#Use the horse animation for camels, both seats.
	#
	#Not animated upstream. A standing camel's saddle is two blocks up, higher than a
	#horse's; the climb is the same, and the camera lerp covers the extra height.
	#Set to false for vanilla mounting on camels.
	animateCamels = true
	#Use the horse animation for striders.
	#Not animated upstream. Set to false for vanilla mounting on striders.
	animateStriders = true

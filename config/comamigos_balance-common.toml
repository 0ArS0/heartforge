[structures]
	#Minimum distance, in chunks, between two structures of different structure sets.
	#The rarer structure (bigger spacing) wins; the other one is not generated. 0 = disabled.
	#Sets in the tag #comamigos_balance:spacing_exempt are ignored. Only affects new chunks.
	# Default: 8
	# Range: 0 ~ 64
	minDistanceChunks = 8
	#Priority classes: "namespace:path=class", wildcards with *. First match wins; unmatched = 2.
	#When two structures would be too close, the higher class wins (ties: bigger spacing, then id).
	#Class 0 = the set is ignored by the rule.
	priorityRules = ["mmr:*=0", "hopo:underwater_city=3", "hopo:underwater_*=1", "hopo:portal_ruined=1", "dwarfs_tyranny:village=0", "cataclysm:*=4", "dungeons_arise:*=4", "bosses_of_mass_destruction:*=4", "mowziesmobs:*=4", "irons_spellbooks:*=4", "block_factorys_bosses:*=4", "aquamirae:*=4", "mythsandlegends:*=4", "iceandfire:pixie_village=3", "iceandfire:graveyard=3", "iceandfire:*=4", "terralith:rare_dungeon=4", "vampirism:mother=4", "minecraft:woodland_mansions=4", "minecraft:ocean_monuments=4", "minecraft:villages=3", "biomeswevegone:villages=3", "terralith:rare_village=3", "minecraft:pillager_outposts=3", "minecraft:desert_pyramids=3", "minecraft:jungle_temples=3", "minecraft:swamp_huts=3", "minecraft:igloos=3", "minecraft:trail_ruins=3", "minecraft:shipwrecks=3", "minecraft:ocean_ruins=3", "mtr:*=3", "vampirism:hunter_camp=1", "vampirism:*=3", "biomeswevegone:aspen_manors=3", "biomeswevegone:prairie_houses=3", "biomeswevegone:bog_trial=3", "born_in_chaos_v1:grave*=1", "mvs:*=1", "supplementaries:road_signs=1", "botania:*=1", "bosa:*=1", "terralith:rubble=1"]

[tiers]
	#Items marked only by a custom_data key (datapack items such as Stellarity) and the tier they need:
	#"key=tier". Gear tiers otherwise come from the item tags comamigos_balance:tier_2 .. tier_8.
	customDataTiers = ["stellarity.special_item=7"]
	#Armor above the server tier can be worn, but each piece loses this fraction of its armor and
	#toughness per tier of difference (0.25 = -25% per tier, capped at 100%).
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	armorPenaltyPerTier = 0.25
	#Slowness levels per tier of difference, using the biggest difference among the worn pieces
	#(1 = +1 tier gives Slowness I, +2 gives Slowness II...). 0 = no slowness.
	# Default: 1
	# Range: 0 ~ 5
	slownessPerTier = 1
	#Melee weapons above the server tier deal this fraction less damage per tier of difference
	#(0.25 = -25% per tier; at 100% they deal no damage). Other locked items (bows, staffs...) stay blocked.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	weaponPenaltyPerTier = 0.25
	#Weakness levels per tier of difference while such a weapon is in the main hand. 0 = none.
	# Default: 1
	# Range: 0 ~ 5
	weaknessPerTier = 1
	#Armor and weapons above the tier lose durability faster: base^difference (2 = x2, x4, x8...). 1 = off.
	# Default: 2.0
	# Range: 1.0 ~ 4.0
	durabilityBase = 2.0

[spawns]
	#Chance that a NATURAL spawn of a mod's mobs is allowed: "namespace=chance" (0..1).
	#Only natural spawning is filtered: structures, spawners, villages, camps, eggs and commands are untouched.
	naturalSpawnChance = ["vampirism=0.1", "werewolves=0.35", "born_in_chaos_v1=0.5", "mythsandlegends=0.5"]
	#Overworld hostile natural spawns: chance allowed at tier I. Grows linearly to 1.0 at tier VI.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	monsterChanceTier1 = 0.5
	#Overworld: max hostile mobs within monsterCapRadius of a new natural spawn, at tier I.
	# Default: 8
	# Range: 0 ~ 200
	monsterCapTier1 = 8
	#Extra hostile mobs allowed per tier above I (tier VIII = tier1 + 7 * this).
	# Default: 3.0
	# Range: 0.0 ~ 50.0
	monsterCapPerTier = 3.0
	#Radius (blocks) counted for the hostile cap. 0 = no cap.
	# Default: 48
	# Range: 0 ~ 128
	monsterCapRadius = 48
	#Within this distance of the world spawn the cap is lower (calmer start). 0 = off.
	# Default: 1500
	# Range: 0 ~ 100000
	spawnCalmRadius = 1500
	#Cap multiplier right at the world spawn; grows linearly to 1.0 at spawnCalmRadius.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	spawnCalmFactor = 0.5
